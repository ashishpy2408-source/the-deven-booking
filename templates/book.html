{% extends "base.html" %}
{% block content %}
<div class="reserve-wrapper">
<h1>Reserve your time</h1>
<p>Choose Space → Duration → Date → Slot.</p>

<div class="booking-grid">
  <div class="left-panel">
    <div class="space-selector">
      <label>Space</label>
      <select id="spaceSelect">
        <option value="daylight">Daylight Studio</option>
        <option value="meeting">Meeting Room</option>
        <option value="studio">Studio</option>
      </select>
    </div>
    <div class="duration-selector">
      <label>Duration</label>
      <select id="durationSelect">
        <option value="1">1 Hour</option>
        <option value="2">2 Hours</option>
        <option value="3">3 Hours</option>
        <option value="6">6 Hours</option>
        <option value="12">12 Hours</option>
      </select>
    </div>
    <div id="calendar"></div>
    <div id="fallbackCal" style="margin-top:15px;">
      <input type="date" id="dateInput">
    </div>
  </div>

  <div class="right-panel">
    <h3 id="selectedDateLabel">Select a date</h3>
    <div id="slotsContainer">
      <p class="hint">Please select a date to see available slots</p>
    </div>
    <div id="bookingForm" style="display:none; margin-top:20px; border-top:1px solid #ddd; padding-top:15px;">
      <h4>Confirm Booking</h4>
      <input type="text" id="custName" placeholder="Your Name" style="width:100%; margin:5px 0; padding:8px;">
      <input type="tel" id="custPhone" placeholder="Phone Number" style="width:100%; margin:5px 0; padding:8px;">
      <button id="confirmBtn" style="width:100%; padding:10px; background:#000; color:#fff; border:none; margin-top:10px;">Confirm Booking</button>
    </div>
  </div>
</div>
</div>

<style>
.booking-grid{display:grid; grid-template-columns:1fr 1fr; gap:20px;}
.slot{padding:10px; margin:5px 0; border:1px solid #ccc; cursor:pointer; border-radius:5px;}
.slot.available:hover{background:#f0f0f0;}
.slot.booked{background:#ffdddd; color:#999; cursor:not-allowed;}
.slot.selected{background:#000; color:#fff;}
</style>

<script>
let selectedDate = null;
let selectedSlot = null;

function loadSlots(){
  if(!selectedDate) return;
  const space = document.getElementById('spaceSelect').value;
  const duration = document.getElementById('durationSelect').value;
  const label = document.getElementById('selectedDateLabel');
  label.innerText = selectedDate + ' · ' + space + ' · ' + duration + 'h';
  const container = document.getElementById('slotsContainer');
  container.innerHTML = '<p>Loading slots...</p>';

  fetch(`/api/slots?date=${selectedDate}&space=${space}&duration=${duration}`)
   .then(r => r.json())
   .then(data => {
      container.innerHTML = '';
      if(data.error){
        container.innerHTML = `<p style="color:red">${data.error}</p>`;
        return;
      }
      if(!data.slots || data.slots.length === 0){
        container.innerHTML = '<p>No slots available for this duration</p>';
        return;
      }
      data.slots.forEach(slot => {
        const div = document.createElement('div');
        div.className = 'slot ' + (slot.available? 'available' : 'booked');
        div.innerText = slot.label + (slot.available? '' : ' (Booked)');
        if(slot.available){
          div.onclick = () => {
            document.querySelectorAll('.slot').forEach(s=>s.classList.remove('selected'));
            div.classList.add('selected');
            selectedSlot = slot;
            document.getElementById('bookingForm').style.display = 'block';
          };
        }
        container.appendChild(div);
      });
    })
   .catch(err => {
      console.error(err);
      container.innerHTML = "<p>Couldn't load. Please try again.</p>";
    });
}

document.addEventListener('DOMContentLoaded', () => {
  const dateInput = document.getElementById('dateInput');
  dateInput.min = new Date().toISOString().split('T')[0];
  dateInput.onchange = (e) => {
    selectedDate = e.target.value;
    loadSlots();
  };

  // Calendar click ke liye - agar aapka calendar library date select karta hai to
  window.setSelectedDate = function(dateStr){
    selectedDate = dateStr;
    dateInput.value = dateStr;
    loadSlots();
  };

  document.getElementById('spaceSelect').onchange = loadSlots;
  document.getElementById('durationSelect').onchange = loadSlots;

  document.getElementById('confirmBtn').onclick = () => {
    const name = document.getElementById('custName').value;
    const phone = document.getElementById('custPhone').value;
    if(!name ||!phone){ alert('Name and Phone required'); return; }
    if(!selectedSlot){ alert('Select a slot'); return; }
    fetch('/api/book', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        space: document.getElementById('spaceSelect').value,
        date: selectedDate,
        start_time: selectedSlot.start,
        end_time: selectedSlot.end,
        duration: document.getElementById('durationSelect').value,
        name, phone
      })
    }).then(r=>r.json()).then(res=>{
      if(res.success){ alert('Booked Successfully!'); location.reload(); }
      else alert(res.message);
    });
  };
});
</script>
{% endblock %}
