<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ studio_name }} — Book</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
  <style>
    :root{
      --blue:#0e7a8c; /* ye wala blue photo se */
      --blue-dark:#0a5c6b;
      --blue-light:#14b8a6;
      --bg:#ffffff;
      --bg-soft:#f0f9fa;
      --ink:#0f172a;
      --muted:#64748b;
      --line:#e2e8f0;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,sans-serif}
    .nav{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
    .nav-inner{max-width:1100px;margin:0 auto;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
    .brand{font-family:Playfair Display,serif;font-weight:700;font-size:24px;color:var(--blue);text-decoration:none;letter-spacing:-0.5px}
    .btn{padding:9px 18px;border-radius:999px;text-decoration:none;font-size:14px;font-weight:600;transition:.2s;border:1px solid var(--line)}
    .btn-ghost{background:white;color:var(--ink)}
    .btn-blue{background:var(--blue);color:white;border-color:var(--blue)}
    .btn-blue:hover{background:var(--blue-dark)}
    .container{max-width:1100px;margin:0 auto;padding:28px 20px}
    /* headings */
    h1{font-family:Playfair Display,serif;font-size:42px;margin:0 0 8px;color:var(--ink)}
    .subtitle{color:var(--muted);margin-bottom:20px}
    /* cards & inputs */
    .card{background:white;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 4px 20px rgba(14,122,140,.06)}
    select, input[type="date"]{padding:10px 12px;border:1px solid var(--line);border-radius:10px;font-size:14px;background:white;outline:none}
    select:focus, input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(14,122,140,.15)}
    /* slot buttons */
    .slot{border:1.5px solid var(--line);background:white;border-radius:12px;padding:12px 8px;text-align:center;cursor:pointer;transition:.2s;font-weight:600}
    .slot:hover{border-color:var(--blue);background:var(--bg-soft);color:var(--blue)}
    .slot.active{background:var(--blue);color:white;border-color:var(--blue)}
    /* big sections */
    .hero-accent{position:relative;overflow:hidden}
    .hero-accent::after{content:"";position:absolute;right:-80px;top:-80px;width:380px;height:380px;background:radial-gradient(300px at center,var(--blue) 0%, transparent 70%);opacity:.18;pointer-events:none;border-radius:50%}
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <div class="nav">
    <div class="nav-inner">
      <a class="brand" href="/">The Deven</a>
      <div style="display:flex;gap:10px">
        <a class="btn btn-ghost" href="/rules">Rules</a>
        <a class="btn btn-blue" href="/admin">Owner</a>
      </div>
    </div>
  </div>
  <div class="container hero-accent">
    {% with messages = get_flashed_messages() %}
      {% if messages %}
        {% for m in messages %}<div class="card" style="margin-bottom:14px;border-left:4px solid var(--blue)">{{ m }}</div>{% endfor %}
      {% endif %}
    {% endwith %}
    {% block content %}{% endblock %}
  </div>
</body>
</html>
