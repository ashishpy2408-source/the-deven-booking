{% extends "base.html" %}
{% block head %}
<style>.wrap{max-width:400px;margin:80px auto;padding:20px}.card{background:white;border:1px solid #e5e7eb;border-radius:18px;padding:24px;box-shadow:0 4px 20px rgba(0,0,0,0.05)}.input{width:100%;padding:12px;border:1px solid #e5e7eb;border-radius:10px;margin-top:12px}.btn{width:100%;background:#0e7a8c;color:white;border:none;padding:12px;border-radius:12px;font-weight:700;margin-top:16px;cursor:pointer}</style>
{% endblock %}
{% block content %}
<div class="wrap"><div class="card">
<h2 style="font-family:Fraunces,serif">Owner Login</h2>
{% if error %}<p style="color:red;font-size:14px">{{ error }}</p>{% endif %}
<form method="POST">
<input class="input" type="password" name="password" placeholder="Enter Password" required>
<button class="btn" type="submit">Login</button>
</form>
</div></div>
{% endblock %}
